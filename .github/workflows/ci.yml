---
name: CI
on:
  push:
    branches:
      - main
      - '*.*.*'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main
      - '*.*.*'

jobs:
  # ============================================================
  # TESTS
  # ============================================================
  tests-latest:
    name: py3.14 unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev slapd ldap-utils mariadb-server
      - name: App armor configuration for slapd
        if: ${{ !env.ACT }}
        # aa-complain fails on ubuntu-24.04, so the profile is unloaded directly:
        # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2079019
        run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd
      - name: Run tests
        env:
          FORCE_COLOR: "1"
        run: |
          # python tzinfo fails on 'act' without this
          ulimit -n 1024
          export TZ=UTC
          uv sync --all-extras
          uv run pytest --numprocesses auto

  tests:
    name: py${{ matrix.python }} unit tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.13'
          - '3.12'
          - '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev slapd ldap-utils mariadb-server
      - name: App armor configuration for slapd
        if: ${{ !env.ACT }}
        # aa-complain fails on ubuntu-24.04, so the profile is unloaded directly:
        # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2079019
        run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd
      - name: Run tests
        env:
          FORCE_COLOR: "1"
        run: |
          # python tzinfo fails on 'act' without this
          ulimit -n 1024
          export TZ=UTC
          uv sync --all-extras --python ${{ matrix.python }}
          uv run pytest --numprocesses auto

  coverage:
    name: code coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev slapd ldap-utils mariadb-server
      - name: App armor configuration for slapd
        if: ${{ !env.ACT }}
        # aa-complain fails on ubuntu-24.04, so the profile is unloaded directly:
        # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2079019
        run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd
      - name: Run tests with coverage
        continue-on-error: true
        env:
          FORCE_COLOR: "1"
        run: |
          # python tzinfo fails on 'act' without this
          ulimit -n 1024
          export TZ=UTC
          uv sync --all-extras
          uv run pytest --cov --cov-fail-under=100 --cov-report=term --cov-report=html --numprocesses auto
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  minversions:
    name: minimum dependency versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev slapd ldap-utils mariadb-server
      - name: App armor configuration for slapd
        if: ${{ !env.ACT }}
        # aa-complain fails on ubuntu-24.04, so the profile is unloaded directly:
        # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2079019
        run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd
      - name: Run tests
        env:
          FORCE_COLOR: "1"
        run: |
          # python tzinfo fails on 'act' without this
          ulimit -n 1024
          export TZ=UTC
          uv sync --all-extras --resolution=lowest-direct --python 3.11
          uv run --no-sync pytest --numprocesses auto

  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev slapd ldap-utils
      - name: App armor configuration for slapd
        if: ${{ !env.ACT }}
        # aa-complain fails on ubuntu-24.04, so the profile is unloaded directly:
        # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2079019
        run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd
      - name: Run linters
        run: |
          # python tzinfo fails on 'act' without this
          ulimit -n 1024
          export TZ=UTC
          uv sync --all-extras
          uv run prek run --all-files

  doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev slapd ldap-utils
      - name: Build documentation
        run: |
          export TZ=UTC
          uv sync --group doc --all-extras
          uv run playwright install --with-deps chromium
          uv run sphinx-build doc build/sphinx/html --fail-on-warning

  # ============================================================
  # BUILD
  # ============================================================
  build-wheel:
    needs: [tests-latest, tests, minversions, style]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canaille-wheel
          path: dist/*.whl
          retention-days: 1

  build-pyinstaller:
    needs: [tests-latest, style]
    # The binary needs the glibc of the build system or a newer one.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev

      - name: Build PyInstaller binary
        run: |
          export TZ=UTC
          uv sync --group release --all-extras --no-dev
          uv run pyinstaller canaille.spec
          ./dist/canaille --version
          uv cache prune --ci

      - name: Upload PyInstaller artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canaille-pyinstaller
          path: dist/canaille
          retention-days: 1

  build-docker:
    needs: [tests-latest, style]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: canaille:integration-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save canaille:integration-test | gzip > canaille-docker.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canaille-docker
          path: canaille-docker.tar.gz
          retention-days: 1

  # ============================================================
  # INTEGRATION
  # ============================================================
  integration-dev:
    name: integration (dev, ${{ matrix.database }})
    needs: [tests-latest, tests, minversions, style]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql, ldap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev

      - name: Install slapd for LDAP tests
        if: matrix.database == 'ldap'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install slapd ldap-utils
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run integration tests
        env:
          FORCE_COLOR: "1"
        run: |
          uv sync --all-groups --all-extras
          uv run pytest integration/ -v --build=dev --database=${{ matrix.database }}

  integration-package:
    name: integration (package, ${{ matrix.database }})
    needs: [build-wheel]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql, ldap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev

      - name: Install slapd for LDAP tests
        if: matrix.database == 'ldap'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install slapd ldap-utils
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-wheel
          path: dist/

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run integration tests
        env:
          FORCE_COLOR: "1"
        run: |
          uv sync --all-groups --all-extras
          WHEEL=$(ls dist/*.whl | head -1)
          uv run pytest integration/ -v --build=package:$WHEEL --database=${{ matrix.database }}

  integration-pyinstaller:
    name: integration (pyinstaller, ${{ matrix.database }})
    needs: [build-pyinstaller]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql, ldap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev

      - name: Install slapd for LDAP tests
        if: matrix.database == 'ldap'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install slapd ldap-utils
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd

      - name: Download PyInstaller artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-pyinstaller
          path: dist/

      - name: Make PyInstaller binary executable
        run: chmod +x dist/canaille

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run integration tests
        env:
          FORCE_COLOR: "1"
        run: |
          uv sync --all-groups --all-extras
          uv run pytest integration/ -v --build=pyinstaller:dist/canaille --database=${{ matrix.database }}

  integration-docker:
    name: integration (docker, ${{ matrix.database }})
    needs: [build-docker]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql, ldap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install apt dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install libsasl2-dev python3-dev libldap2-dev libssl-dev

      - name: Install slapd for LDAP tests
        if: matrix.database == 'ldap'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt --yes --quiet install slapd ldap-utils
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd

      - name: Download Docker image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-docker
          path: .

      - name: Load Docker image
        run: gunzip -c canaille-docker.tar.gz | docker load

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run integration tests
        env:
          FORCE_COLOR: "1"
        run: |
          uv sync --all-groups --all-extras
          uv run pytest integration/ -v --build=docker:canaille:integration-test --database=${{ matrix.database }}

  integration-minimal:
    name: integration (minimal extras)
    needs: [build-wheel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-wheel
          path: dist/

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Run integration tests with minimal extras
        env:
          FORCE_COLOR: "1"
        run: |
          uv sync --all-groups --extra server --extra sqlite
          WHEEL=$(ls dist/*.whl | head -1)
          uv run pytest integration/ -v --build=package:$WHEEL --database=sqlite --extras=server,sqlite

  # ============================================================
  # PUBLISH (only on tags)
  # ============================================================
  publish-pypi:
    needs: [integration-dev, integration-package, integration-pyinstaller, integration-docker, integration-minimal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github-release:
    needs: [integration-dev, integration-package, integration-pyinstaller, integration-docker, integration-minimal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-wheel
          path: dist/

      - name: Download PyInstaller artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-pyinstaller
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/canaille
            dist/*.whl

  publish-docker-hub:
    needs: [integration-dev, integration-package, integration-pyinstaller, integration-docker, integration-minimal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canaille-docker
          path: .

      - name: Load Docker image
        run: gunzip -c canaille-docker.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          VERSION="${GITHUB_REF_NAME}"
          docker tag canaille:integration-test yaalcoop/canaille:latest
          docker tag canaille:integration-test yaalcoop/canaille:${VERSION}
          docker push yaalcoop/canaille:latest
          docker push yaalcoop/canaille:${VERSION}
